
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fleet-pulse-backend
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    environment:
      PORT: 4000

  frontend:
    build:
      context: ./fleet-pulse/frontend
      dockerfile: Dockerfile
    container_name: fleet-pulse-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
